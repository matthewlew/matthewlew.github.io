<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>
    <!-- Status shapes. Named for what they DRAW, not what they mean: a status is
         bound to a colour in lds.css and to a shape here, and neither binding
         belongs in the other's name. `checkCircle` is what success happens to
         use today; calling the symbol `success` would freeze that. The two
         semantic names already in this sprite (error, warning) predate the rule
         and are kept so existing consumers do not break. -->
    <symbol id="checkCircle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/>
      <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
    </symbol>
    <symbol id="xCircle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/>
      <path d="M9 9l6 6M15 9l-6 6"/>
    </symbol>
    <symbol id="infoCircle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/>
      <path d="M12 11.2v5.3M12 7.6h.01"/>
    </symbol>
    <symbol id="helpCircle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
