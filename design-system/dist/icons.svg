    </symbol>
    <symbol id="warning" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3.5 21.5 20h-19L12 3.5z"/>
      <path d="M12 10v4.2M12 17.2h.01"/>
    </symbol>
    <symbol id="error" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
