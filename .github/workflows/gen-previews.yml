name: Generate gradient preview pages

# Prerenders palette/g/<slug>.html for every gradient in Supabase so shared
# links get rich OG cards. Runs on a schedule (new gradients get a page within
# ~15 min of being saved/shared) and can be triggered manually.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gen-previews
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate preview pages
        run: node scripts/gen-previews.mjs
      - name: Commit any changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain palette/g)" ]; then
            git add palette/g
            git commit -m "chore: regenerate gradient preview pages"
            git push
          else
            echo "No preview changes."
          fi
